name: CI-CD

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI (PHP 8.2)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jmrtextile_test
          POSTGRES_USER: allan
          POSTGRES_PASSWORD: etherion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U allan -d jmrtextile_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI_ENVIRONMENT: testing
      JWT_SECRET_KEY: test-secret-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none
          extensions: mbstring, intl, pgsql, pdo_pgsql

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint PHP files
        run: find app tests -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Run test suite
        run: php vendor/bin/phpunit --no-coverage

  cd:
    name: CD (Build Release Artifact)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: Create release archive
        run: |
          mkdir -p build/release
          zip -r "build/release/jmr-textile-backend-${GITHUB_REF_NAME}.zip" \
            app public writable vendor spark composer.json composer.lock README.md LICENSE env

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: jmr-textile-backend-${{ github.ref_name }}
          path: build/release/jmr-textile-backend-${{ github.ref_name }}.zip
          retention-days: 30
